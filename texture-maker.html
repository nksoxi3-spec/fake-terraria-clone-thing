<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texture Maker</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 1rem; background: #111827; color: #e5edff; }
    .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; align-items: start; }
    .panel { background: #1f2937; border: 1px solid #34425a; border-radius: 10px; padding: 0.8rem; }
    label { display: block; margin-top: 0.5rem; font-size: 0.9rem; }
    input, button, select { margin-top: 0.25rem; }
    #preview {
      border: 1px solid #4f6b90;
      image-rendering: pixelated;
      background-image:
        linear-gradient(45deg, #2a3448 25%, transparent 25%),
        linear-gradient(-45deg, #2a3448 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a3448 75%),
        linear-gradient(-45deg, transparent 75%, #2a3448 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      cursor: crosshair;
    }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>Texture Maker</h1>
  <p>Transparent background by default. Tools: Draw, Fill, Erase, Clear, Export PNG.</p>
  <div class="wrap">
    <div class="panel">
      <label>Width (pixels): <input type="number" id="w" value="24" min="1" max="512"></label>
      <label>Height (pixels): <input type="number" id="h" value="24" min="1" max="512"></label>
      <label>Zoom (display scale): <input type="number" id="scale" value="16" min="1" max="40"></label>
      <button id="resize">Create / Resize</button>

      <label>Color: <input type="color" id="color" value="#7f8aa2"></label>
      <label>Tool:
        <select id="tool">
          <option value="draw">Draw</option>
          <option value="fill">Fill</option>
          <option value="erase">Erase</option>
        </select>
      </label>

      <div class="row" style="margin-top: 0.75rem;">
        <button id="clear">Clear</button>
        <button id="export">Export PNG</button>
      </div>
    </div>

    <div class="panel">
      <canvas id="preview" width="24" height="24"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('preview');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const wInput = document.getElementById('w');
    const hInput = document.getElementById('h');
    const scaleInput = document.getElementById('scale');
    const toolInput = document.getElementById('tool');
    const colorInput = document.getElementById('color');

    const resizeBtn = document.getElementById('resize');
    const clearBtn = document.getElementById('clear');
    const exportBtn = document.getElementById('export');

    function applyScale() {
      const scale = Math.max(1, Number(scaleInput.value) || 1);
      canvas.style.width = `${canvas.width * scale}px`;
      canvas.style.height = `${canvas.height * scale}px`;
    }

    function resizeCanvas() {
      const old = document.createElement('canvas');
      old.width = canvas.width;
      old.height = canvas.height;
      old.getContext('2d').drawImage(canvas, 0, 0);

      canvas.width = Math.max(1, Number(wInput.value) || 24);
      canvas.height = Math.max(1, Number(hInput.value) || 24);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(old, 0, 0);
      applyScale();
    }

    function getPixel(evt) {
      const rect = canvas.getBoundingClientRect();
      const px = Math.floor((evt.clientX - rect.left) / rect.width * canvas.width);
      const py = Math.floor((evt.clientY - rect.top) / rect.height * canvas.height);
      return { x: Math.max(0, Math.min(canvas.width - 1, px)), y: Math.max(0, Math.min(canvas.height - 1, py)) };
    }

    function pixelColor(x, y) {
      const d = ctx.getImageData(x, y, 1, 1).data;
      return `${d[0]},${d[1]},${d[2]},${d[3]}`;
    }

    function hexToRgba(hex) {
      const h = hex.replace('#', '');
      return {
        r: parseInt(h.substring(0, 2), 16),
        g: parseInt(h.substring(2, 4), 16),
        b: parseInt(h.substring(4, 6), 16),
        a: 255,
      };
    }

    function drawPixel(x, y) {
      ctx.fillStyle = colorInput.value;
      ctx.fillRect(x, y, 1, 1);
    }

    function erasePixel(x, y) {
      ctx.clearRect(x, y, 1, 1);
    }

    function fillAt(x, y) {
      const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = image.data;
      const idx = (y * canvas.width + x) * 4;
      const target = [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
      const fill = hexToRgba(colorInput.value);
      if (target[0] === fill.r && target[1] === fill.g && target[2] === fill.b && target[3] === fill.a) return;

      const stack = [[x, y]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= canvas.width || cy >= canvas.height) continue;
        const i = (cy * canvas.width + cx) * 4;
        if (
          data[i] !== target[0] || data[i + 1] !== target[1] ||
          data[i + 2] !== target[2] || data[i + 3] !== target[3]
        ) continue;

        data[i] = fill.r;
        data[i + 1] = fill.g;
        data[i + 2] = fill.b;
        data[i + 3] = fill.a;

        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }

      ctx.putImageData(image, 0, 0);
    }

    let drawing = false;
    canvas.addEventListener('mousedown', (e) => {
      drawing = true;
      const { x, y } = getPixel(e);
      const tool = toolInput.value;
      if (tool === 'draw') drawPixel(x, y);
      if (tool === 'erase') erasePixel(x, y);
      if (tool === 'fill') fillAt(x, y);
    });

    window.addEventListener('mouseup', () => { drawing = false; });
    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const tool = toolInput.value;
      if (tool === 'fill') return;
      const { x, y } = getPixel(e);
      if (tool === 'draw') drawPixel(x, y);
      if (tool === 'erase') erasePixel(x, y);
    });

    clearBtn.addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));
    exportBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `texture-${canvas.width}x${canvas.height}.png`;
      a.click();
    });

    resizeBtn.addEventListener('click', resizeCanvas);
    scaleInput.addEventListener('input', applyScale);

    applyScale();
  </script>
</body>
</html>
